<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN SPIRITS | Luxury Reserve</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c5a059; 
            --royal-purple: #1a0033;
            --neon-purple: rgba(138, 43, 226, 0.6);
        }

        /* --- FLUIDEZ DE SCROLL --- */
        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at center, var(--royal-purple) 0%, #000 100%);
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- NEBLINA DINÂMICA (ROXO MÍSTICO) --- */
        #smoke-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; mix-blend-mode: screen; }
        .smoke { position: absolute; border-radius: 50%; filter: blur(130px); animation: float var(--d) infinite ease-in-out; opacity: 0; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translate(var(--x), var(--y)) scale(2.8); opacity: 0; }
        }

        header { padding: 80px 20px 40px; text-align: center; position: relative; z-index: 10; }
        .brand { 
            font-family: 'Cinzel Decorative', cursive; 
            color: var(--gold); 
            font-size: clamp(2.5rem, 10vw, 4rem); 
            letter-spacing: 12px; 
            text-transform: uppercase;
            text-shadow: 0 0 35px var(--neon-purple);
        }

        /* --- CONTAINER DOS CARDS --- */
        .showcase { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 50px; 
            padding: 40px 5% 100px; 
            position: relative; 
            z-index: 20; 
        }
        
        /* --- CARDS FLUIDOS (SEM EMPURRAR NINGUÉM) --- */
        .card { 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.15); 
            padding: 55px 35px; 
            text-align: center; 
            border-radius: 50px; 
            width: 320px;
            /* A mágica: Transformações que não afetam o layout vizinho */
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1), 
                        box-shadow 0.8s cubic-bezier(0.19, 1, 0.22, 1),
                        border-color 0.5s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            will-change: transform;
        }

        /* O Card agora cresce SEM desalinhar as garrafas ao lado */
        .card:hover { 
            transform: scale(1.08); /* Cresce suavemente para todos os lados */
            border-color: var(--gold); 
            box-shadow: 0 0 60px var(--neon-purple);
            z-index: 30; /* Fica por cima dos outros na animação */
        }

        .card img { 
            width: 100%; 
            height: 320px; 
            object-fit: contain; 
            margin-bottom: 35px; 
            filter: drop-shadow(0 25px 45px #000); 
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        /* Garrafa se mantém centrada e apenas dá um leve zoom */
        .card:hover img { transform: scale(1.05); }
        
        .name { font-family: 'Cinzel Decorative', cursive; font-size: 1.2rem; color: #fff; margin-bottom: 10px; }
        .price { color: var(--gold); font-size: 1.5rem; font-weight: 600; margin-bottom: 40px; display: block; }

        /* --- BOTÃO FLUIDO --- */
        .btn { 
            display: block; text-decoration: none; color: #000; 
            background: linear-gradient(135deg, #c5a059 0%, #f5d76e 50%, #c5a059 100%);
            padding: 22px; font-size: 0.85rem; letter-spacing: 4px; font-weight: 700; 
            border-radius: 60px; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--gold); color: #fff; }

        /* --- RODAPÉ --- */
        footer { 
            text-align: center; padding: 60px 20px 100px; color: #666; 
            font-size: 0.8rem; z-index: 10; position: relative; letter-spacing: 3px;
        }
        .legal { color: #aaa; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; display: block; letter-spacing: 4px; }
    </style>
</head>
<body>
    <div id="smoke-container"></div>
    <header><h1 class="brand">Golden Spirits</h1></header>

    <main class="showcase">
        <div class="card">
            <img src="img/miami.jpg" alt="Miami Polo">
            <p class="name">Royal Salute 21Y</p>
            <span class="price">R$ 1.399,99</span>
            <a href="https://amzn.to/3P38WqD" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/macallan_18.jpg" alt="Macallan 18">
            <p class="name">The Macallan 18Y</p>
            <span class="price">R$ 3.349,90</span>
            <a href="https://amzn.to/4s79U3R" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/blue_umami.jpg" alt="Blue Label Umami">
            <p class="name">JW Blue Label</p>
            <span class="price">R$ 2.556,90</span>
            <a href="https://amzn.to/4usoODs" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/hibiki_21.jpg" alt="Hibiki 21">
            <p class="name">Hibiki 21 Anos</p>
            <span class="price">R$ 6.300,79</span>
            <a href="https://amzn.to/40p41mh" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
    </main>

    <footer>
        <span class="legal">Consumo proibido para menores de 18 anos.</span>
        <p>© 2026 GOLDEN SPIRITS - TODOS OS DIREITOS RESERVADOS.</p>
    </footer>

    <script>
        const container = document.getElementById('smoke-container');
        for (let i = 0; i < 75; i++) {
            const smoke = document.createElement('div');
            smoke.className = 'smoke';
            const size = Math.random() * 900 + 500;
            smoke.style.width = size + 'px';
            smoke.style.height = size + 'px';
            smoke.style.background = 'radial-gradient(circle, rgba(138, 43, 226, 0.45) 0%, transparent 75%)';
            smoke.style.left = Math.random() * 120 - 10 + '%';
            smoke.style.top = Math.random() * 120 - 10 + '%';
            smoke.style.setProperty('--x', (Math.random() * 1200 - 600) + 'px');
            smoke.style.setProperty('--y', (Math.random() * 1200 - 600) + 'px');
            smoke.style.setProperty('--d', (Math.random() * 20 + 15) + 's');
            smoke.style.animationDelay = (Math.random() * 10) + 's';
            container.appendChild(smoke);
        }
    </script>
</body>
</html>
