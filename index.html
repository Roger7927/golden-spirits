<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEN SPIRITS | Luxury Reserve</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c5a059; 
            --royal-purple: #1a0033;
            --neon-purple: rgba(138, 43, 226, 0.6);
        }

        /* --- AJUSTES GERAIS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: radial-gradient(circle at center, var(--royal-purple) 0%, #000 100%);
            color: #fff; font-family: 'Montserrat', sans-serif; overflow-x: hidden; min-height: 100vh;
        }

        /* --- FUMAÇA INTELIGENTE (Leve no celular) --- */
        #smoke-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; mix-blend-mode: screen; }
        .smoke { position: absolute; border-radius: 50%; filter: blur(80px); animation: float var(--d) infinite ease-in-out; opacity: 0; will-change: transform; }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translate(var(--x), var(--y)) scale(2); opacity: 0; }
        }

        header { padding: 60px 20px 30px; text-align: center; position: relative; z-index: 10; }
        .brand { 
            font-family: 'Cinzel Decorative', cursive; color: var(--gold); 
            font-size: clamp(1.8rem, 8vw, 3.5rem); letter-spacing: 8px; 
            text-transform: uppercase; text-shadow: 0 0 30px var(--neon-purple);
        }

        .showcase { 
            display: flex; flex-wrap: wrap; justify-content: center; 
            gap: 25px; padding: 20px 15px 80px; position: relative; z-index: 20; 
        }
        
        /* --- CARDS ADAPTÁVEIS --- */
        .card { 
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.15); 
            padding: 35px 20px; text-align: center; border-radius: 40px; 
            width: 100%; max-width: 320px; /* No PC é 320px, no celular ocupa a largura disponível */
            transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        /* --- MEDIA QUERIES (A MÁGICA DO CELULAR) --- */
        @media (max-width: 768px) {
            .brand { letter-spacing: 4px; }
            .showcase { gap: 20px; padding-bottom: 50px; }
            .card { padding: 30px 15px; border-radius: 30px; }
            .card img { height: 250px !important; } /* Diminui a garrafa no celular */
            .smoke { filter: blur(50px); } /* Fumaça mais leve para não travar o celular */
        }

        .card:hover { transform: scale(1.03); border-color: var(--gold); box-shadow: 0 0 40px var(--neon-purple); }
        .card img { width: 100%; height: 320px; object-fit: contain; margin-bottom: 20px; filter: drop-shadow(0 15px 30px #000); }
        
        .name { font-family: 'Cinzel Decorative', cursive; font-size: 1.1rem; color: #fff; margin-bottom: 8px; }
        .price { color: var(--gold); font-size: 1.4rem; font-weight: 600; margin-bottom: 25px; display: block; }

        .btn { 
            display: block; text-decoration: none; color: #000; 
            background: linear-gradient(135deg, #c5a059 0%, #f5d76e 50%, #c5a059 100%);
            padding: 18px; font-size: 0.8rem; letter-spacing: 3px; font-weight: 700; border-radius: 50px;
        }

        footer { text-align: center; padding: 40px 20px; color: #555; font-size: 0.75rem; z-index: 10; position: relative; }
        .legal { color: #888; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <div id="smoke-container"></div>
    <header><h1 class="brand">Golden Spirits</h1></header>

    <main class="showcase">
        <div class="card">
            <img src="img/miami.jpg" alt="Miami Polo">
            <p class="name">Royal Salute 21Y</p>
            <span class="price">R$ 1.399,99</span>
            <a href="https://amzn.to/3P38WqD" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/macallan_18.jpg" alt="Macallan 18">
            <p class="name">The Macallan 18Y</p>
            <span class="price">R$ 3.349,90</span>
            <a href="https://amzn.to/4s79U3R" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/blue_umami.jpg" alt="Blue Label Umami">
            <p class="name">JW Blue Label</p>
            <span class="price">R$ 2.556,90</span>
            <a href="https://amzn.to/4usoODs" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/hibiki_21.jpg" alt="Hibiki 21">
            <p class="name">Hibiki 21 Anos</p>
            <span class="price">R$ 6.300,79</span>
            <a href="https://amzn.to/40p41mh" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
    </main>

    <footer>
        <span class="legal">Consumo proibido para menores de 18 anos.</span>
        <p>© 2026 GOLDEN SPIRITS - TODOS OS DIREITOS RESERVADOS.</p>
    </footer>

    <script>
        const container = document.getElementById('smoke-container');
        // Detecta se é celular para reduzir partículas
        const particleCount = window.innerWidth < 768 ? 30 : 55;
        
        for (let i = 0; i < particleCount; i++) {
            const smoke = document.createElement('div');
            smoke.className = 'smoke';
            const size = Math.random() * 600 + 300;
            smoke.style.width = size + 'px';
            smoke.style.height = size + 'px';
            smoke.style.background = 'radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 70%)';
            smoke.style.left = Math.random() * 100 + '%';
            smoke.style.top = Math.random() * 100 + '%';
            smoke.style.setProperty('--x', (Math.random() * 600 - 300) + 'px');
            smoke.style.setProperty('--y', (Math.random() * 600 - 300) + 'px');
            smoke.style.setProperty('--d', (Math.random() * 20 + 15) + 's');
            container.appendChild(smoke);
        }
    </script>
</body>
</html>
