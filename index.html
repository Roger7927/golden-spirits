<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEN SPIRITS | Luxury Reserve</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c5a059; 
            --royal-purple: #1a0033;
            --neon-purple: rgba(138, 43, 226, 0.6);
        }

        /* --- LIMPEZA E FLUIDEZ NATIVA --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html { scroll-behavior: smooth; }

        body { 
            background: #000;
            background-image: radial-gradient(circle at center, var(--royal-purple) 0%, #000 100%);
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            min-height: 100vh;
            /* Força renderização suave no Chrome/Safari */
            -webkit-font-smoothing: antialiased;
        }

        /* --- FUMAÇA OTIMIZADA (Menos Blur = Mais Velocidade) --- */
        #smoke-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; mix-blend-mode: screen; }
        .smoke { 
            position: absolute; 
            border-radius: 50%; 
            filter: blur(60px); /* Reduzido de 120 para 60 para ganhar fluidez */
            animation: float var(--d) infinite ease-in-out; 
            opacity: 0; 
            will-change: transform; /* Avisa ao navegador para usar a GPU */
        }
        
        @keyframes float {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translate3d(var(--x), var(--y), 0) scale(2); opacity: 0; }
        }

        header { padding: 60px 20px 20px; text-align: center; position: relative; z-index: 10; }
        .brand { 
            font-family: 'Cinzel Decorative', cursive; color: var(--gold); 
            font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: 8px; 
            text-transform: uppercase; text-shadow: 0 0 20px var(--neon-purple);
        }

        .showcase { 
            display: flex; flex-wrap: wrap; justify-content: center; 
            gap: 25px; padding: 20px 15px 80px; position: relative; z-index: 20; 
        }
        
        /* --- CARDS ESTÁVEIS --- */
        .card { 
            background: rgba(15, 15, 15, 0.9); 
            border: 1px solid rgba(197, 160, 89, 0.2); 
            padding: 40px 20px; text-align: center; border-radius: 40px; 
            width: 100%; max-width: 310px;
            /* Usa translate3d para animação via hardware (liso como seda) */
            transform: translate3d(0,0,0);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
        }

        .card:hover { 
            transform: translate3d(0, -10px, 0) scale(1.02); 
            border-color: var(--gold); 
            box-shadow: 0 0 30px var(--neon-purple); 
        }

        .card img { 
            width: 100%; height: 280px; object-fit: contain; 
            margin-bottom: 20px; filter: drop-shadow(0 10px 20px #000); 
        }
        
        .name { font-family: 'Cinzel Decorative', cursive; font-size: 1.1rem; color: #fff; margin-bottom: 8px; }
        .price { color: var(--gold); font-size: 1.4rem; font-weight: 600; margin-bottom: 25px; display: block; }

        .btn { 
            display: block; text-decoration: none; color: #000; 
            background: linear-gradient(135deg, #c5a059 0%, #f5d76e 50%, #c5a059 100%);
            padding: 18px; font-size: 0.8rem; letter-spacing: 3px; font-weight: 700; border-radius: 50px;
        }

        footer { text-align: center; padding: 40px 20px 100px; color: #555; font-size: 0.8rem; z-index: 10; position: relative; }
        .legal { color: #aaa; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; display: block; letter-spacing: 2px; }

        /* AJUSTE PARA CELULAR */
        @media (max-width: 768px) {
            .card { max-width: 290px; padding: 30px 15px; }
            .card img { height: 240px; }
            .smoke { filter: blur(40px); } /* Mais leve ainda no celular */
        }
    </style>
</head>
<body>
    <div id="smoke-container"></div>
    <header><h1 class="brand">Golden Spirits</h1></header>

    <main class="showcase">
        <div class="card">
            <img src="img/miami.jpg" alt="Miami Polo">
            <p class="name">Royal Salute 21Y</p>
            <span class="price">R$ 1.399,99</span>
            <a href="https://amzn.to/3P38WqD" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/macallan_18.jpg" alt="Macallan 18">
            <p class="name">The Macallan 18Y</p>
            <span class="price">R$ 3.349,90</span>
            <a href="https://amzn.to/4s79U3R" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/blue_umami.jpg" alt="Blue Label Umami">
            <p class="name">JW Blue Label</p>
            <span class="price">R$ 2.556,90</span>
            <a href="https://amzn.to/4usoODs" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
        <div class="card">
            <img src="img/hibiki_21.jpg" alt="Hibiki 21">
            <p class="name">Hibiki 21 Anos</p>
            <span class="price">R$ 6.300,79</span>
            <a href="https://amzn.to/40p41mh" target="_blank" class="btn">ADQUIRIR AGORA</a>
        </div>
    </main>

    <footer>
        <span class="legal">Consumo proibido para menores de 18 anos.</span>
        <p>© 2026 GOLDEN SPIRITS - TODOS OS DIREITOS RESERVADOS.</p>
    </footer>

    <script>
        const container = document.getElementById('smoke-container');
        // Reduzi para 30 partículas (equilíbrio perfeito entre visual e RAM)
        const count = window.innerWidth < 768 ? 20 : 35;
        
        for (let i = 0; i < count; i++) {
            const smoke = document.createElement('div');
            smoke.className = 'smoke';
            const size = Math.random() * 500 + 300;
            smoke.style.width = size + 'px';
            smoke.style.height = size + 'px';
            smoke.style.background = 'radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 70%)';
            smoke.style.left = Math.random() * 100 + '%';
            smoke.style.top = Math.random() * 100 + '%';
            smoke.style.setProperty('--x', (Math.random() * 600 - 300) + 'px');
            smoke.style.setProperty('--y', (Math.random() * 600 - 300) + 'px');
            smoke.style.setProperty('--d', (Math.random() * 20 + 15) + 's');
            container.appendChild(smoke);
        }
    </script>
</body>
</html>
